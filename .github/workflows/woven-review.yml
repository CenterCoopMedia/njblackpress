name: Historical notes review

on:
  pull_request:
    paths:
      - 'docs/woven.html'
      - 'docs/historical-notes.html'
      - 'docs/js/woven/**'
      - 'docs/css/woven*.css'
      - 'docs/css/styles.css'
      - 'docs/css/tailwind.css'
      - 'docs/js/site-nav.js'
      - 'docs/data/**'
      - 'docs/vendor/**'
      - 'data/test_woven*.py'
      - 'data/test_woven*.mjs'
      - 'data/test_site_data.py'
      - 'data/test_navigation.py'
      - 'scripts/*woven*'
      - 'package*.json'
      - 'tailwind.config.js'
      - 'src/input.css'
      - '.github/workflows/woven-review.yml'

permissions:
  contents: read

concurrency:
  group: woven-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check static data and layout
        run: |
          npm ci
          npm run build:css
          python3 data/test_site_data.py
          python3 data/test_woven_layout.py
          python3 data/test_woven_usability.py
          python3 data/test_navigation.py
          node scripts/test-woven-exhibit.mjs
          node data/test_woven_model.mjs
      - name: Install browser checks
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check desktop, touch, keyboard, motion, and fallback behavior
        run: python scripts/review_woven.py --output /tmp/woven-review
      - name: Save visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woven-visual-review
          path: /tmp/woven-review
          retention-days: 14
