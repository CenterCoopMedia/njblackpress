name: Woven review

on:
  push:
    branches: [codex/woven-reimagined]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package the public source for local browser review
        run: git archive --format=tar.gz --output=/tmp/woven-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: woven-review-source
          path: /tmp/woven-source.tar.gz
          retention-days: 1
