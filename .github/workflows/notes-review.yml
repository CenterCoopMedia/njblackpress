name: Historical notes review

on:
  pull_request:
    paths:
      - 'docs/woven.html'
      - 'docs/historical-notes.html'
      - 'docs/js/notes/**'
      - 'docs/css/notes.css'
      - 'docs/css/styles.css'
      - 'docs/css/tailwind.css'
      - 'docs/js/site-nav.js'
      - 'docs/data/**'
      - 'docs/data/nj-outline.json'
      - 'docs/vendor/**'
      - 'data/test_notes_model.mjs'
      - 'data/test_site_data.py'
      - 'data/test_navigation.py'
      - 'scripts/build_nj_outline.py'
      - 'scripts/review_notes.py'
      - 'package*.json'
      - 'tailwind.config.js'
      - 'src/input.css'
      - '.github/workflows/notes-review.yml'

permissions:
  contents: read

concurrency:
  group: notes-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check static data and time map model
        run: |
          npm ci
          npm run build:css
          python3 data/test_site_data.py
          python3 data/test_navigation.py
          node --experimental-default-type=module data/test_notes_model.mjs
      - name: Install browser checks
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Check time map browser behavior
        run: python3 scripts/review_notes.py --output /tmp/notes-review
      - name: Save visual review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-visual-review
          path: /tmp/notes-review
          retention-days: 14
